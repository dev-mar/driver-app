# Conductor: más plugins Android que pasajero → más Metaspace; sin daemon reutilizado (org.gradle.daemon=false).
org.gradle.jvmargs=-Xmx5G -XX:MaxMetaspaceSize=2G -XX:+UseG1GC -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
android.useAndroidX=true
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.daemon=false

kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false
kotlin.caching.enabled=false
android.builtInKotlin=false
android.newDsl=false
